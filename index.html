<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VetTranslate</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='34' fill='rgb(248,217,224)'/><text x='90' y='110' font-family='Arial, sans-serif' font-size='64' font-weight='700' fill='rgb(107,107,107)' text-anchor='middle'>VT</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='rgb(248,217,224)'/><text x='90' y='110' font-family='Arial, sans-serif' font-size='64' font-weight='700' fill='rgb(107,107,107)' text-anchor='middle'>VT</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#EFF3EC;
  --surface:#FFFFFF;
  --ink:#1F2B24;
  --ink-soft:#5B6B60;
  --accent:#B7E28C;
  --accent-ink:#2E4A0F;
  --pine:#3E6259;
  --line:#D8E0D4;
  --wheat:rgba(255,213,64,0.4);
  --wheat-ink:#8A6D00;
  --wheat-border:rgba(255,193,7,0.5);
  --danger:#C1573E;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 2px 6px;
}
.header .tag{
  width:34px;height:34px;
  border-radius:50%;
  background:rgb(27,94,112);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.header .tag svg{width:30px;height:30px;}
.header h1{
  font-family:'Baloo 2',sans-serif;
  font-size:19px;
  font-weight:700;
  margin:0;
  letter-spacing:0.2px;
}
.header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  letter-spacing:0.6px;
  margin-top:1px;
}

/* Card surface */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:16px;
}

/* Live translate block */
.field-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--ink-soft);
  margin-bottom:8px;
  display:block;
}
textarea{
  width:100%;
  min-height:76px;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font-family:'Inter',sans-serif;
  font-size:16px;
  color:var(--ink);
  resize:none;
  background:#FBFCFA;
}
textarea:focus{outline:none;border-color:var(--pine);}

.chips{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.chip{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:12.5px;
  padding:8px 4px 8px 12px;
  border-radius:8px;
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  transition:background .12s,border-color .12s,color .12s;
}
.chip::after{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:var(--wheat);
  margin-right:6px;
  flex-shrink:0;
}
.chip.active{
  background:var(--wheat);
  border-color:var(--wheat-border);
  color:var(--wheat-ink);
}
.chip.active::after{background:var(--accent);}
.chip-add{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:12.5px;
  padding:8px 12px;
  border-radius:8px;
  border:1.5px dashed var(--accent);
  background:transparent;
  color:var(--accent-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  min-height:36px;
}

.add-lang-panel{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}
.add-lang-panel select{
  flex:1;
  padding:9px 10px;
  border-radius:8px;
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
}
.add-lang-panel button{
  border:none;
  border-radius:8px;
  padding:9px 12px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
}
#confirmAddLangBtn{background:var(--accent);color:var(--accent-ink);}
#cancelAddLangBtn{background:transparent;color:var(--ink-soft);}

.export-btn{
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:600;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .12s;
}
.export-btn:active{background:var(--line);}

.mic-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}
.mic-row select{
  flex:1;
  padding:9px 10px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:#FBFCFA;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
}
.mic-btn{
  width:40px;height:40px;
  border-radius:50%;
  border:1.5px solid var(--pine);
  background:var(--surface);
  color:var(--pine);
  font-size:17px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background .12s,border-color .12s,transform .12s;
}
.mic-btn:active{transform:scale(0.94);}
.mic-btn.listening{
  background:var(--danger);
  border-color:var(--danger);
  color:#fff;
  animation:mic-pulse 1.2s infinite;
}
.mic-btn:disabled{opacity:.4;cursor:default;animation:none;}
@keyframes mic-pulse{
  0%{box-shadow:0 0 0 0 rgba(193,87,62,0.45);}
  70%{box-shadow:0 0 0 9px rgba(193,87,62,0);}
  100%{box-shadow:0 0 0 0 rgba(193,87,62,0);}
}
.mic-status{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
}

.output-wrap{
  margin-top:12px;
  border-radius:12px;
  border:1.5px dashed var(--line);
  padding:14px;
  background:#FBFCFA;
  min-height:56px;
  display:none;
}
.output-wrap.show{display:block;}
.output-text{
  font-size:17px;
  line-height:1.42;
  font-weight:500;
  color:var(--ink);
}
.output-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.icon-btn{
  border:1.5px solid var(--accent);
  background:var(--accent);
  border-radius:8px;
  padding:7px 12px;
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:600;
  color:var(--accent-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.icon-btn:active{filter:brightness(0.94);}

/* Section divider */
.section-title{
  font-family:'Baloo 2',sans-serif;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin:2px 0 0;
}

/* Category tabs */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
}
.tab{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:8px 13px;
  border-radius:999px;
  border:1.5px solid var(--accent);
  background:var(--accent);
  color:var(--accent-ink);
  white-space:nowrap;
  cursor:pointer;
  flex-shrink:0;
}
.tab.active{
  background:var(--accent);
  border-color:var(--pine);
  color:var(--accent-ink);
  font-weight:700;
}
.tab-fav{
  border-color:var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
}
.tab-fav.active{
  background:var(--wheat);
  border-color:var(--wheat-border);
  color:var(--wheat-ink);
}

/* Phrase cards */
.phrase-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.phrase{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
}
.phrase-header{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.phrase-chevron{
  font-size:12px;
  color:var(--ink-soft);
  flex-shrink:0;
  width:12px;
}
.phrase-title{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
}
.phrase-collapsible{
  margin-top:10px;
}
.phrase-text{
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  white-space:pre-line;
}
.star-btn{
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  border-radius:6px;
  width:32px;height:28px;
  font-size:14px;
  cursor:pointer;
  color:var(--wheat-ink);
}
.star-btn.active{background:var(--wheat);color:var(--wheat-ink);}
.edit-btn{
  border:none;
  background:transparent;
  border-radius:6px;
  width:32px;height:28px;
  font-size:15px;
  cursor:pointer;
  color:var(--pine);
}
.edit-textarea{
  width:100%;
  min-height:76px;
  border:1.5px solid var(--pine);
  border-radius:10px;
  padding:10px 12px;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  line-height:1.5;
  color:var(--ink);
  background:#FBFCFA;
}
.edit-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.edit-save{
  border:none;
  background:var(--pine);
  color:#fff;
  border-radius:8px;
  padding:8px 14px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
}
.edit-cancel{
  border:none;
  background:transparent;
  color:var(--ink-soft);
  font-size:12.5px;
  cursor:pointer;
}
.phrase-output{
  margin-top:8px;
  font-size:14.5px;
  color:var(--pine);
  font-weight:600;
  display:none;
  align-items:center;
  gap:8px;
}
.phrase-output.show{display:flex;align-items:flex-start;}
.phrase-output-text{flex:1;white-space:pre-line;}
.phrase-speak-btn{
  border:1.5px solid var(--line);
  background:#FBFCFA;
  border-radius:8px;
  width:32px;height:32px;
  flex-shrink:0;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.phrase-speak-btn:active{background:var(--line);}
.phrase-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.mini-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  padding:6px 9px;
  border-radius:6px;
  border:1px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  cursor:pointer;
}
.mini-chip.active{background:var(--wheat);border-color:var(--wheat-border);color:var(--wheat-ink);}
.phrase-del{
  margin-left:auto;
  border:none;
  background:none;
  color:var(--danger);
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  padding:6px 4px;
}

/* Add card form */
.add-card{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:8px;
  align-items:center;
}
.add-card input{
  flex:1;
  border:none;
  background:transparent;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  padding:6px 2px;
}
.add-card input:focus{outline:none;}
.add-card button{
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:9px 14px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  flex-shrink:0;
}

.hint{
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.4;
  padding:0 2px;
}
.loading-dot{
  display:inline-block;
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

.cards-section{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.cards-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

/* Tablet: one wider column; tabs wrap instead of scrolling sideways */
@media (min-width:700px){
  .app{max-width:760px;padding:28px 24px 48px;}
  .tabs{flex-wrap:wrap;overflow:visible;}
}
/* Desktop: translator on the left (stays in view), cards on the right */
@media (min-width:1000px){
  .app{
    max-width:1240px;
    display:grid;
    grid-template-columns:minmax(360px,420px) minmax(0,1fr);
    align-content:start;
    align-items:start;
    column-gap:32px;
    padding:32px 40px 56px;
  }
  .header{grid-column:1 / -1;}
  .translate-panel{grid-column:1;position:sticky;top:24px;}
  .cards-section{grid-column:2;}
  #inputText{min-height:130px;}
}
/* Wide desktop: cards in two columns; an open card takes the full width */
@media (min-width:1200px){
  .phrase-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}
  .phrase.open,
  .phrase-list > .hint{grid-column:1 / -1;}
}

[hidden]{display:none !important;}
.legacy-banner{
  background:rgba(255,213,64,0.14);
  border:1.5px solid var(--wheat-border);
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  line-height:1.45;
  color:var(--ink);
}
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(31,43,36,0.35);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:10;
}
.modal{
  background:var(--surface);
  border-radius:var(--radius);
  padding:18px;
  width:100%;
  max-width:360px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.modal input{
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  font-family:'Inter',sans-serif;
  font-size:16px;
  color:var(--ink);
  background:#FBFCFA;
}
.modal input:focus{outline:none;border-color:var(--pine);}

@media (prefers-reduced-motion: reduce){
  .loading-dot{animation:none;}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="tag">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(9,-2) scale(0.82)">
          <path d="M32,30 C30,18 40,10 50,13 L60,6 L56,17 C68,17 76,28 75,40 C74,50 68,58 68,66 C68,72 72,76 72,76 L58,76 C58,76 56,68 56,60 C50,62 42,60 38,54 C32,55 26,50 26,42 C26,36 28,32 32,30 Z" fill="white"/>
        </g>
        <circle cx="55" cy="83" r="1.8" fill="white"/>
        <circle cx="59" cy="77" r="2.6" fill="white"/>
        <circle cx="59" cy="68" r="3.4" fill="white"/>
        <circle cx="64" cy="65" r="3" fill="white"/>
        <circle cx="65" cy="71" r="3.6" fill="white"/>
        <text x="50" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">VT</text>
      </svg>
    </div>
    <div>
      <h1>VetTranslate</h1>
      <div class="sub">RU · DE · EN · ES</div>
    </div>
  </div>

  <!-- LIVE TRANSLATION -->
  <div class="card translate-panel">
    <span class="field-label">Что сказать / перевод</span>
    <textarea id="inputText" placeholder="Пишите на любом языке — русском, немецком, английском, испанском…"></textarea>

    <div class="mic-row">
      <select id="micLangSelect"></select>
      <button type="button" class="mic-btn" id="micBtn" title="Голосовой ввод">
        <span class="mic-icon">🎤</span>
      </button>
      <span class="mic-status" id="micStatus"></span>
    </div>

    <span class="field-label" style="margin-top:14px;display:block;">Перевести на</span>
    <div class="chips" id="langChips"></div>
    <div class="add-lang-panel" id="addLangPanel" style="display:none;">
      <select id="newLangSelect"></select>
      <button id="confirmAddLangBtn">Добавить</button>
      <button id="cancelAddLangBtn">Отмена</button>
    </div>

    <div class="output-wrap" id="outputWrap">
      <div class="output-text" id="outputText"></div>
      <div class="output-actions">
        <button class="icon-btn" id="speakBtn">🔊 Озвучить</button>
        <button class="icon-btn" id="copyBtn">⧉ Копировать</button>
      </div>
    </div>
  </div>

  <!-- CARDS -->
  <section class="cards-section">
    <div class="cards-head">
      <div class="section-title">Готовые карточки</div>
      <button type="button" id="exportCardsBtn" class="export-btn">Экспорт карточек</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="legacy-banner" id="legacyBanner" hidden>
      <div id="legacyText"></div>
      <div class="edit-actions">
        <button type="button" class="edit-save" id="legacyUploadBtn">Добавить на сайт</button>
        <button type="button" class="edit-cancel" id="legacyDismissBtn">Не добавлять</button>
      </div>
    </div>
    <div class="hint" id="syncStatus" hidden></div>
    <div class="phrase-list" id="phraseList"></div>

    <div class="add-card">
      <input id="newCardText" type="text" placeholder="Добавить фразу на русском…">
      <button id="addCardBtn">+ Карточка</button>
    </div>
    <div class="hint">Карточка переводится на язык, который выбран кнопкой на ней самой — язык можно менять для каждой карточки отдельно.</div>
  </section>

</div>

<div class="modal-backdrop" id="passwordModal" hidden>
  <form class="modal" id="passwordForm">
    <div class="section-title">Пароль для изменений</div>
    <div class="hint" id="passwordHint"></div>
    <input type="password" id="passwordInput" autocomplete="current-password">
    <div class="edit-actions">
      <button type="submit" class="edit-save">Войти</button>
      <button type="button" class="edit-cancel" id="passwordCancelBtn">Отмена</button>
    </div>
  </form>
</div>

<script>
const BASE_LANGS = [
  { code:'ru', name:'русский', locale:'ru-RU' },
  { code:'de', name:'немецкий', locale:'de-DE' },
  { code:'en', name:'английский', locale:'en-US' },
  { code:'es', name:'испанский', locale:'es-ES' }
];

const LANGUAGE_CATALOG = [
  { code:'fr', name:'французский', locale:'fr-FR' },
  { code:'it', name:'итальянский', locale:'it-IT' },
  { code:'pt', name:'португальский', locale:'pt-PT' },
  { code:'pl', name:'польский', locale:'pl-PL' },
  { code:'uk', name:'украинский', locale:'uk-UA' },
  { code:'nl', name:'нидерландский', locale:'nl-NL' },
  { code:'tr', name:'турецкий', locale:'tr-TR' },
  { code:'ar', name:'арабский', locale:'ar-SA' },
  { code:'zh', name:'китайский', locale:'zh-CN' },
  { code:'sv', name:'шведский', locale:'sv-SE' },
  { code:'ro', name:'румынский', locale:'ro-RO' },
  { code:'cs', name:'чешский', locale:'cs-CZ' }
];

let activeLangs = [...BASE_LANGS];
const ALL_LANGS = [...BASE_LANGS, ...LANGUAGE_CATALOG];
let selectedLang = 'de';

function langInfo(code){
  return activeLangs.find(l => l.code === code) || { code, name: code, locale: 'en-US' };
}

function storageGet(key){
  try{
    const value = localStorage.getItem(key);
    return value === null ? null : { value };
  }catch(e){
    return null;
  }
}
function storageSet(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.error('storage error', e);
    return false;
  }
}
function storageRemove(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

async function loadLanguages(){
  try{
    const res = storageGet('vet-translate-extra-langs');
    const extra = res ? JSON.parse(res.value) : [];
    activeLangs = [...BASE_LANGS, ...extra];
  }catch(e){
    activeLangs = [...BASE_LANGS];
  }
}

async function saveExtraLanguages(){
  const extra = activeLangs.filter(l => !BASE_LANGS.some(b => b.code === l.code));
  storageSet('vet-translate-extra-langs', JSON.stringify(extra));
}

function renderLangChips(){
  const container = document.getElementById('langChips');
  container.innerHTML = '';
  activeLangs.forEach(l=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (l.code === selectedLang ? ' active' : '');
    chip.textContent = l.code.toUpperCase();
    chip.onclick = ()=>{
      selectedLang = l.code;
      renderLangChips();
      scheduleLiveTranslate();
    };
    container.appendChild(chip);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'chip-add';
  addBtn.textContent = '+ язык';
  addBtn.onclick = openAddLangPanel;
  container.appendChild(addBtn);
}

function openAddLangPanel(){
  const panel = document.getElementById('addLangPanel');
  const select = document.getElementById('newLangSelect');
  const available = LANGUAGE_CATALOG.filter(c => !activeLangs.some(a => a.code === c.code));
  if(available.length === 0){
    select.innerHTML = '<option>Все основные языки уже добавлены</option>';
  }else{
    select.innerHTML = available.map(c => `<option value="${c.code}">${c.name}</option>`).join('');
  }
  panel.style.display = 'flex';
}

document.getElementById('confirmAddLangBtn').onclick = async ()=>{
  const select = document.getElementById('newLangSelect');
  const code = select.value;
  const found = LANGUAGE_CATALOG.find(c => c.code === code);
  if(found && !activeLangs.some(a => a.code === code)){
    activeLangs.push(found);
    await saveExtraLanguages();
    selectedLang = found.code;
    renderLangChips();
    renderPhrases();
    scheduleLiveTranslate();
  }
  document.getElementById('addLangPanel').style.display = 'none';
};

document.getElementById('cancelAddLangBtn').onclick = ()=>{
  document.getElementById('addLangPanel').style.display = 'none';
};

const FAVORITES_TAB = '__favorites__';

// Cards live on the server (worker/) so every device sees the same ones.
// DEFAULT_CARDS are shown until the first edit saves them there.
// Viewing is open; editing needs a password, remembered on each device.
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8787'
  : 'https://vettranslate-api.kotsergeyiber.workers.dev';
const CARDS_CACHE_KEY = 'vet-translate-cards-cache';
const LEGACY_CARDS_KEY = 'vet-translate-cards'; // cards saved only in this browser (before the server)
const PASSWORD_KEY = 'vet-translate-edit-password';

let cards = null;
let activeTab = 'Жалобы';

function newId(){
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function withIds(source){
  const out = {};
  Object.keys(source).forEach(cat=>{
    out[cat] = source[cat].map(item => ({ id: item.id || newId(), text: item.text, favorite: item.favorite === true }));
  });
  return out;
}

function applyServerCards(state){
  if(state.cards){
    cards = state.cards;
    storageSet(CARDS_CACHE_KEY, JSON.stringify(cards));
  }else{
    cards = withIds(DEFAULT_CARDS);
  }
  if(activeTab !== FAVORITES_TAB && !cards[activeTab]) activeTab = Object.keys(cards)[0] || FAVORITES_TAB;
}

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.hidden = !text;
}

async function loadCards(){
  const cached = storageGet(CARDS_CACHE_KEY);
  if(cached){
    try{ cards = JSON.parse(cached.value); }catch(e){ cards = null; }
    if(cards){ renderTabs(); renderPhrases(); }
  }
  try{
    const res = await fetch(API_BASE + '/cards', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    applyServerCards(await res.json());
    setSyncStatus('');
    checkLegacyCards();
  }catch(e){
    if(!cards) cards = withIds(DEFAULT_CARDS);
    setSyncStatus('Нет связи с сервером — карточки могут быть устаревшими.');
  }
  renderTabs();
  renderPhrases();
}

function getEditPassword(message){
  const saved = storageGet(PASSWORD_KEY);
  if(saved && !message) return Promise.resolve(saved.value);
  const modal = document.getElementById('passwordModal');
  const input = document.getElementById('passwordInput');
  document.getElementById('passwordHint').textContent = message || 'Нужен один раз на этом устройстве.';
  input.value = '';
  modal.hidden = false;
  input.focus();
  return new Promise(resolve=>{
    document.getElementById('passwordForm').onsubmit = (ev)=>{
      ev.preventDefault();
      if(!input.value) return;
      storageSet(PASSWORD_KEY, input.value);
      modal.hidden = true;
      resolve(input.value);
    };
    document.getElementById('passwordCancelBtn').onclick = ()=>{
      modal.hidden = true;
      resolve(null);
    };
  });
}

async function postCardsOp(op, password){
  const res = await fetch(API_BASE + '/cards', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Edit-Password': password },
    body: JSON.stringify(op)
  });
  return { res, data: await res.json().catch(()=>({})) };
}

let editInProgress = false;

// Sends one edit to the server and re-renders with the result. Returns true if saved.
// Taps made while an edit is still saving are ignored, so a double tap can't add a card twice.
async function editCards(op){
  if(editInProgress) return false;
  editInProgress = true;
  try{
    return await sendEdit(op);
  }finally{
    editInProgress = false;
  }
}

async function sendEdit(op, passwordMessage){
  const password = await getEditPassword(passwordMessage);
  if(password === null) return false;
  setSyncStatus('Сохраняем…');
  try{
    let { res, data } = await postCardsOp(op, password);
    if(res.status === 409 && data.error === 'empty'){
      // Nothing saved on the server yet: save the cards shown now, then apply the edit.
      ({ res, data } = await postCardsOp({ type: 'import', cards }, password));
      if(res.ok) ({ res, data } = await postCardsOp(op, password));
    }
    if(res.status === 401){
      storageRemove(PASSWORD_KEY);
      setSyncStatus('');
      return sendEdit(op, 'Неверный пароль, попробуйте ещё раз.');
    }
    if(res.status === 429){
      setSyncStatus('Слишком много неверных попыток. Попробуйте через 15 минут.');
      return false;
    }
    if(!res.ok){
      setSyncStatus('Не удалось сохранить (' + (data.message || data.error || res.status) + '). Обновите страницу и попробуйте снова.');
      return false;
    }
    applyServerCards(data);
    setSyncStatus('');
    renderTabs();
    renderPhrases();
    return true;
  }catch(e){
    setSyncStatus('Нет связи с сервером — изменения не сохранены.');
    return false;
  }
}

function legacyCardsMissing(legacyCards){
  const title = text => text.split('\n')[0].trim().toLowerCase();
  const allCards = Object.values(cards).flat();
  let missing = 0;
  Object.keys(legacyCards).forEach(cat=>{
    (Array.isArray(legacyCards[cat]) ? legacyCards[cat] : []).forEach(item=>{
      const text = typeof item.text === 'string' ? item.text.trim() : '';
      if(!text) return;
      // Same rule as the server merge: same text anywhere, or same title in the category, is not new.
      const match = allCards.find(c => c.text === text)
        || (cards[cat] || []).find(c => title(c.text) === title(text));
      if(!match || (item.favorite === true && !match.favorite)) missing++;
    });
  });
  return missing;
}

function archiveLegacyCards(){
  const legacy = storageGet(LEGACY_CARDS_KEY);
  if(legacy) storageSet(LEGACY_CARDS_KEY + '-backup', legacy.value);
  storageRemove(LEGACY_CARDS_KEY);
  document.getElementById('legacyBanner').hidden = true;
}

// Offers to upload cards that were saved only in this browser by the old version.
function checkLegacyCards(){
  const legacy = storageGet(LEGACY_CARDS_KEY);
  if(!legacy) return;
  let legacyCards;
  try{ legacyCards = JSON.parse(legacy.value); }catch(e){ return; }
  if(!legacyCards || typeof legacyCards !== 'object') return;
  const missing = legacyCardsMissing(legacyCards);
  if(missing === 0){ archiveLegacyCards(); return; }
  document.getElementById('legacyText').textContent =
    `В этом браузере есть карточки, которых нет на сайте (${missing}). Добавить их на сайт, чтобы они были видны на всех устройствах?`;
  document.getElementById('legacyBanner').hidden = false;
  document.getElementById('legacyUploadBtn').onclick = async ()=>{
    if(await editCards({ type: 'import', cards: legacyCards })) archiveLegacyCards();
  };
  document.getElementById('legacyDismissBtn').onclick = archiveLegacyCards;
}

document.getElementById('exportCardsBtn').addEventListener('click', ()=>{
  const json = JSON.stringify(cards, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'vet-translate-cards.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';

  const favTab = document.createElement('div');
  favTab.className = 'tab tab-fav' + (activeTab===FAVORITES_TAB ? ' active':'');
  favTab.textContent = '⭐ Избранное';
  favTab.onclick = ()=>{ activeTab = FAVORITES_TAB; expandedKey = null; renderTabs(); renderPhrases(); };
  tabsEl.appendChild(favTab);

  Object.keys(cards).forEach(cat=>{
    const t = document.createElement('div');
    t.className = 'tab' + (cat===activeTab ? ' active':'');
    t.textContent = cat;
    t.onclick = ()=>{ activeTab = cat; expandedKey = null; renderTabs(); renderPhrases(); };
    tabsEl.appendChild(t);
  });
}

function getEntries(){
  if(activeTab === FAVORITES_TAB){
    const entries = [];
    Object.keys(cards).forEach(cat=>{
      cards[cat].forEach(item=>{
        if(item.favorite) entries.push(item);
      });
    });
    return entries;
  }
  return cards[activeTab] || [];
}

let expandedKey = null;

function cardTitle(text){
  const firstLine = text.split('\n')[0];
  return firstLine
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
    .replace(/^[\s.:•·]+/, '')
    .replace(/[.:]+$/, '')
    .trim();
}
function cardBody(text){
  const lines = text.split('\n');
  return lines.slice(1).join('\n');
}

function renderPhrases(){
  const list = document.getElementById('phraseList');
  list.innerHTML = '';
  const addCardBox = document.querySelector('.add-card');
  const addCardHint = addCardBox.nextElementSibling;
  if(activeTab === FAVORITES_TAB){
    addCardBox.style.display = 'none';
    if(addCardHint) addCardHint.style.display = 'none';
  }else{
    addCardBox.style.display = 'flex';
    if(addCardHint) addCardHint.style.display = 'block';
  }
  const entries = getEntries();
  if(entries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.textContent = activeTab === FAVORITES_TAB
      ? 'Пока нет избранных карточек — отметьте нужные звёздочкой в любой категории.'
      : 'Пока нет карточек в этой категории — добавьте свою фразу ниже.';
    list.appendChild(empty);
    return;
  }
  entries.forEach(item=>{
    const key = item.id;
    const isOpen = expandedKey === key;
    const el = document.createElement('div');
    el.className = 'phrase' + (isOpen ? ' open' : '');
    const chipsHtml = activeLangs.map(l => `<div class="mini-chip" data-lang="${l.code}">${l.code.toUpperCase()}</div>`).join('');
    const body = cardBody(item.text);
    el.innerHTML = `
      <div class="phrase-header">
        <span class="phrase-chevron">${isOpen ? '▾' : '▸'}</span>
        <span class="phrase-title">${escapeHtml(cardTitle(item.text))}</span>
      </div>
      <div class="phrase-collapsible" ${isOpen ? '' : 'style="display:none;"'}>
        ${body ? `<div class="phrase-text">${escapeHtml(body)}</div>` : ''}
        <div class="phrase-output"></div>
        <div class="phrase-actions">
          ${chipsHtml}
          <button class="star-btn ${item.favorite ? 'active':''}" title="В избранное">${item.favorite ? '★' : '☆'}</button>
          <button class="edit-btn" title="Редактировать">✎</button>
          <button class="phrase-del">удалить</button>
        </div>
      </div>
    `;
    el.querySelector('.phrase-header').onclick = ()=>{
      expandedKey = isOpen ? null : key;
      renderPhrases();
    };
    if(isOpen){
      const chips = el.querySelectorAll('.mini-chip');
      chips.forEach(chip=>{
        chip.onclick = async (ev)=>{
          ev.stopPropagation();
          chips.forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          const lang = chip.dataset.lang;
          const outEl = el.querySelector('.phrase-output');
          outEl.classList.add('show');
          outEl.innerHTML = '<span class="loading-dot">переводим…</span>';
          try{
            const translated = await translate(item.text, lang);
            renderPhraseOutput(outEl, translated, lang);
          }catch(e){
            outEl.textContent = 'Ошибка перевода, попробуйте ещё раз.';
          }
        };
      });
      el.querySelector('.star-btn').onclick = async (ev)=>{
        ev.stopPropagation();
        await editCards({ type: 'favorite', id: item.id, value: !item.favorite });
      };
      el.querySelector('.edit-btn').onclick = (ev)=>{
        ev.stopPropagation();
        enterEditMode(el, item);
      };
      el.querySelector('.phrase-del').onclick = async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Удалить карточку «' + cardTitle(item.text) + '»?')) return;
        await editCards({ type: 'delete', id: item.id });
      };
    }
    list.appendChild(el);
  });
}

function enterEditMode(el, item){
  el.innerHTML = `
    <textarea class="edit-textarea">${escapeHtml(item.text)}</textarea>
    <div class="edit-actions">
      <button class="edit-save">Сохранить</button>
      <button class="edit-cancel">Отмена</button>
    </div>
  `;
  const textarea = el.querySelector('.edit-textarea');
  textarea.style.minHeight = Math.max(76, item.text.split('\n').length * 22) + 'px';
  el.querySelector('.edit-save').onclick = async ()=>{
    const newText = textarea.value.trim();
    if(!newText || newText === item.text){ renderPhrases(); return; }
    await editCards({ type: 'update', id: item.id, text: newText });
  };
  el.querySelector('.edit-cancel').onclick = ()=>{ renderPhrases(); };
}

function renderPhraseOutput(outEl, translatedText, lang){
  outEl.innerHTML = '';
  const textSpan = document.createElement('span');
  textSpan.className = 'phrase-output-text';
  textSpan.textContent = translatedText;
  const speakBtn = document.createElement('button');
  speakBtn.className = 'phrase-speak-btn';
  speakBtn.textContent = '🔊';
  speakBtn.onclick = () => speak(translatedText, lang);
  outEl.appendChild(textSpan);
  outEl.appendChild(speakBtn);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function translate(text, targetLang){
  const response = await fetch(API_BASE + '/translate', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, target: langInfo(targetLang).name })
  });
  const data = await response.json();
  if(!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
  return (data.text || '').trim();
}

let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){ cachedVoices = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickVoice(localeCode){
  const wantLang = localeCode.split('-')[0]; // e.g. 'ru' from 'ru-RU'
  if(cachedVoices.length === 0) refreshVoices();
  // 1) exact locale match, e.g. 'ru-RU'
  let voice = cachedVoices.find(v => v.lang.toLowerCase() === localeCode.toLowerCase());
  // 2) same language prefix, e.g. any 'ru-*'
  if(!voice) voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(wantLang + '-') || v.lang.toLowerCase() === wantLang);
  return voice || null;
}

function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const localeCode = langInfo(lang).locale || 'en-US';
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = localeCode;
    const voice = pickVoice(localeCode);
    if(voice){
      utter.voice = voice;
    } else {
      // No matching voice installed on this device — skip rather than risk
      // the browser silently substituting a voice from a different language.
      console.warn('No voice found for', localeCode, '— speech skipped.');
      return;
    }
    window.speechSynthesis.speak(utter);
  }catch(e){ /* speech not available, silently skip */ }
}

// --- Live translation block ---
const inputTextEl = document.getElementById('inputText');
const outputWrap = document.getElementById('outputWrap');
const outputText = document.getElementById('outputText');

let liveTranslateTimer = null;
let liveTranslateSeq = 0;

function scheduleLiveTranslate(){
  if(liveTranslateTimer) clearTimeout(liveTranslateTimer);
  const text = inputTextEl.value.trim();
  if(!text){
    outputWrap.classList.remove('show');
    outputText.innerHTML = '';
    return;
  }
  liveTranslateTimer = setTimeout(()=>runLiveTranslate(text), 500);
}

async function runLiveTranslate(text){
  const seq = ++liveTranslateSeq;
  outputWrap.classList.add('show');
  outputText.innerHTML = '<span class="loading-dot">•••</span>';
  try{
    const result = await translate(text, selectedLang);
    if(seq !== liveTranslateSeq) return; // устарел — ввод уже изменился
    outputText.textContent = result;
  }catch(e){
    if(seq !== liveTranslateSeq) return;
    outputText.textContent = 'Не получилось перевести. Проверьте соединение и попробуйте снова.';
  }
}

inputTextEl.addEventListener('input', scheduleLiveTranslate);

// --- Voice input (client speaks, text appears + translates automatically) ---
const micBtn = document.getElementById('micBtn');
const micLangSelect = document.getElementById('micLangSelect');
const micStatus = document.getElementById('micStatus');

micLangSelect.innerHTML = ALL_LANGS.map(l => `<option value="${l.code}">${l.name}</option>`).join('');
(function restoreMicLang(){
  const saved = storageGet('vet-translate-mic-lang');
  const code = saved ? saved.value : 'de';
  if(ALL_LANGS.some(l => l.code === code)) micLangSelect.value = code;
})();
micLangSelect.addEventListener('change', ()=>{
  storageSet('vet-translate-mic-lang', micLangSelect.value);
});

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let micBaseText = '';

if(!SpeechRecognitionCtor){
  micBtn.disabled = true;
  micBtn.title = 'Голосовой ввод не поддерживается в этом браузере (попробуйте Chrome)';
  micStatus.textContent = 'не поддерживается браузером';
}

function stopListening(){
  if(recognition){
    try{ recognition.stop(); }catch(e){}
  }
}

function startListening(){
  const info = ALL_LANGS.find(l => l.code === micLangSelect.value) || ALL_LANGS[0];
  micBaseText = inputTextEl.value;
  const sep = micBaseText && !/[\s\n]$/.test(micBaseText) ? ' ' : '';

  recognition = new SpeechRecognitionCtor();
  recognition.lang = info.locale;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=>{
    isListening = true;
    micBtn.classList.add('listening');
    micStatus.textContent = 'слушаю…';
  };
  recognition.onresult = (event)=>{
    let finalText = '';
    let interimText = '';
    for(let i=0; i<event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalText += transcript;
      else interimText += transcript;
    }
    inputTextEl.value = micBaseText + sep + finalText + interimText;
    scheduleLiveTranslate();
  };
  recognition.onerror = (event)=>{
    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      micStatus.textContent = 'нет доступа к микрофону';
    }else if(event.error === 'no-speech'){
      micStatus.textContent = 'не расслышала, попробуйте снова';
    }
  };
  recognition.onend = ()=>{
    isListening = false;
    micBtn.classList.remove('listening');
    if(micStatus.textContent === 'слушаю…') micStatus.textContent = '';
    scheduleLiveTranslate();
  };

  try{
    recognition.start();
  }catch(e){
    micStatus.textContent = 'не удалось запустить микрофон';
  }
}

micBtn.onclick = ()=>{
  if(isListening){
    stopListening();
  }else{
    startListening();
  }
};

document.getElementById('speakBtn').onclick = ()=>{
  speak(outputText.textContent, selectedLang);
};

document.getElementById('copyBtn').onclick = ()=>{
  navigator.clipboard.writeText(outputText.textContent).catch(()=>{});
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  btn.textContent = '✓ Скопировано';
  setTimeout(()=>{ btn.textContent = original; }, 1200);
};

document.getElementById('addCardBtn').onclick = async ()=>{
  const input = document.getElementById('newCardText');
  const text = input.value.trim();
  if(!text) return;
  if(await editCards({ type: 'add', cat: activeTab, text })) input.value = '';
};

document.getElementById('newCardText').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.isComposing) document.getElementById('addCardBtn').click();
});

(async function init(){
  await loadLanguages();
  renderLangChips();
  await loadCards();
})();
</script>
