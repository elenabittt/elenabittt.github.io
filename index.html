<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VetTranslate</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='34' fill='rgb(248,217,224)'/><text x='90' y='110' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'>VT</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='rgb(248,217,224)'/><text x='90' y='110' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'>VT</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#EFF3EC;
  --surface:#FFFFFF;
  --ink:#1F2B24;
  --ink-soft:#5B6B60;
  --accent:#B7E28C;
  --accent-ink:#2E4A0F;
  --pine:#3E6259;
  --line:#D8E0D4;
  --wheat:rgba(255,213,64,0.4);
  --wheat-ink:#8A6D00;
  --wheat-border:rgba(255,193,7,0.5);
  --danger:#C1573E;
  --radius:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 2px 6px;
}
.header .tag{
  width:34px;height:34px;
  border-radius:50%;
  background:rgb(27,94,112);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.header .tag svg{width:30px;height:30px;}
.header h1{
  font-family:'Baloo 2',sans-serif;
  font-size:19px;
  font-weight:700;
  margin:0;
  letter-spacing:0.2px;
}
.header .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  letter-spacing:0.6px;
  margin-top:1px;
}

/* Card surface */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:16px;
}

/* API Key Setup */
.api-setup{
  background:#FFF9E6;
  border:1.5px solid var(--wheat-border);
  border-radius:var(--radius);
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.api-setup-title{
  font-family:'Baloo 2',sans-serif;
  font-size:13px;
  font-weight:700;
  color:var(--wheat-ink);
}
.api-setup input{
  width:100%;
  border:1.5px solid var(--wheat-border);
  border-radius:8px;
  padding:9px 12px;
  font-family:'Inter',sans-serif;
  font-size:13px;
  color:var(--ink);
  background:#FFFBF0;
}
.api-setup input:focus{outline:none;border-color:var(--pine);}
.api-setup-buttons{
  display:flex;
  gap:8px;
}
.api-setup button{
  flex:1;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}
.api-save{
  background:var(--accent);
  color:var(--accent-ink);
}
.api-cancel{
  background:transparent;
  color:var(--ink-soft);
  border:1px solid var(--line);
}
.api-status{
  font-size:11px;
  padding:6px 8px;
  border-radius:6px;
  text-align:center;
}
.api-status.ok{
  background:rgba(183,226,140,0.2);
  color:var(--accent-ink);
}
.api-status.error{
  background:rgba(193,87,62,0.2);
  color:var(--danger);
}

/* Live translate block */
.field-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--ink-soft);
  margin-bottom:8px;
  display:block;
}
textarea{
  width:100%;
  min-height:76px;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font-family:'Inter',sans-serif;
  font-size:16px;
  color:var(--ink);
  resize:none;
  background:#FBFCFA;
}
textarea:focus{outline:none;border-color:var(--pine);}

.chips{
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.chip{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:12.5px;
  padding:8px 4px 8px 12px;
  border-radius:8px;
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  transition:background .12s,border-color .12s,color .12s;
}
.chip::after{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:var(--wheat);
  margin-right:6px;
  flex-shrink:0;
}
.chip.active{
  background:var(--wheat);
  border-color:var(--wheat-border);
  color:var(--wheat-ink);
}
.chip.active::after{background:var(--accent);}
.chip-add{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:12.5px;
  padding:8px 12px;
  border-radius:8px;
  border:1.5px dashed var(--accent);
  background:transparent;
  color:var(--accent-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  min-height:36px;
}

.add-lang-panel{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}
.add-lang-panel select{
  flex:1;
  padding:9px 10px;
  border-radius:8px;
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  font-family:'Inter',sans-serif;
  font-size:14px;
}
.add-lang-panel button{
  border:none;
  border-radius:8px;
  padding:9px 12px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
}
#confirmAddLangBtn{background:var(--accent);color:var(--accent-ink);}
#cancelAddLangBtn{background:transparent;color:var(--ink-soft);}

.translate-btn{
  margin-top:12px;
  width:100%;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:var(--accent-ink);
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:15px;
  padding:13px;
  cursor:pointer;
  transition:filter .12s;
}
.translate-btn:active{filter:brightness(0.94);}
.translate-btn:disabled{opacity:.55;cursor:default;}

.output-wrap{
  margin-top:12px;
  border-radius:12px;
  border:1.5px dashed var(--line);
  padding:14px;
  background:#FBFCFA;
  min-height:56px;
  display:none;
}
.output-wrap.show{display:block;}
.output-text{
  font-size:17px;
  line-height:1.42;
  font-weight:500;
  color:var(--ink);
}
.output-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.icon-btn{
  border:1.5px solid var(--accent);
  background:var(--accent);
  border-radius:8px;
  padding:7px 12px;
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:600;
  color:var(--accent-ink);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.icon-btn:active{filter:brightness(0.94);}

/* Section divider */
.section-title{
  font-family:'Baloo 2',sans-serif;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin:2px 0 0;
}

/* Category tabs */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
}
.tab{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:8px 13px;
  border-radius:999px;
  border:1.5px solid var(--accent);
  background:var(--accent);
  color:var(--accent-ink);
  white-space:nowrap;
  cursor:pointer;
  flex-shrink:0;
}
.tab.active{
  background:var(--accent);
  border-color:var(--pine);
  color:var(--accent-ink);
  font-weight:700;
}
.tab-fav{
  border-color:var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
}
.tab-fav.active{
  background:var(--wheat);
  border-color:var(--wheat-border);
  color:var(--wheat-ink);
}

/* Phrase cards */
.phrase-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.phrase{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
}
.phrase-header{
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.phrase-chevron{
  font-size:12px;
  color:var(--ink-soft);
  flex-shrink:0;
  width:12px;
}
.phrase-title{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
}
.phrase-collapsible{
  margin-top:10px;
}
.phrase-text{
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  white-space:pre-line;
}
.star-btn{
  border:1.5px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  border-radius:6px;
  width:32px;height:28px;
  font-size:14px;
  cursor:pointer;
  color:var(--wheat-ink);
}
.star-btn.active{background:var(--wheat);color:var(--wheat-ink);}
.edit-btn{
  border:none;
  background:transparent;
  border-radius:6px;
  width:32px;height:28px;
  font-size:15px;
  cursor:pointer;
  color:var(--pine);
}
.edit-textarea{
  width:100%;
  min-height:76px;
  border:1.5px solid var(--pine);
  border-radius:10px;
  padding:10px 12px;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  line-height:1.5;
  color:var(--ink);
  background:#FBFCFA;
}
.edit-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}
.edit-save{
  border:none;
  background:var(--pine);
  color:#fff;
  border-radius:8px;
  padding:8px 14px;
  font-weight:700;
  font-size:12.5px;
  cursor:pointer;
}
.edit-cancel{
  border:none;
  background:transparent;
  color:var(--ink-soft);
  font-size:12.5px;
  cursor:pointer;
}
.phrase-output{
  margin-top:8px;
  font-size:14.5px;
  color:var(--pine);
  font-weight:600;
  display:none;
  align-items:center;
  gap:8px;
}
.phrase-output.show{display:flex;align-items:flex-start;}
.phrase-output-text{flex:1;white-space:pre-line;}
.phrase-speak-btn{
  border:1.5px solid var(--line);
  background:#FBFCFA;
  border-radius:8px;
  width:32px;height:32px;
  flex-shrink:0;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.phrase-speak-btn:active{background:var(--line);}
.phrase-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.mini-chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  padding:6px 9px;
  border-radius:6px;
  border:1px solid var(--wheat-border);
  background:rgba(255,213,64,0.14);
  color:var(--wheat-ink);
  cursor:pointer;
}
.mini-chip.active{background:var(--wheat);border-color:var(--wheat-border);color:var(--wheat-ink);}
.phrase-del{
  margin-left:auto;
  border:none;
  background:none;
  color:var(--danger);
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  padding:6px 4px;
}

/* Add card form */
.add-card{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:8px;
  align-items:center;
}
.add-card input{
  flex:1;
  border:none;
  background:transparent;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  color:var(--ink);
  padding:6px 2px;
}
.add-card input:focus{outline:none;}
.add-card button{
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  border-radius:8px;
  padding:9px 14px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  flex-shrink:0;
}

.hint{
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.4;
  padding:0 2px;
}
.loading-dot{
  display:inline-block;
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){
  .loading-dot{animation:none;}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="tag">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(9,-2) scale(0.82)">
          <path d="M32,30 C30,18 40,10 50,13 L60,6 L56,17 C68,17 76,28 75,40 C74,50 68,58 68,66 C68,72 72,76 72,76 L58,76 C58,76 56,68 56,60 C50,62 42,60 38,54 C32,55 26,50 26,42 C26,36 28,32 32,30 Z" fill="currentColor"/>
        </g>
        <circle cx="55" cy="83" r="1.8" fill="white"/>
        <circle cx="59" cy="77" r="2.6" fill="white"/>
        <circle cx="59" cy="68" r="3.4" fill="white"/>
        <circle cx="64" cy="65" r="3" fill="white"/>
        <circle cx="65" cy="71" r="3.6" fill="white"/>
        <text x="50" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">VT</text>
      </svg>
    </div>
    <div>
      <h1>VetTranslate</h1>
      <div class="sub">RU · DE · EN · ES</div>
    </div>
  </div>

  <!-- API KEY SETUP -->
  <div id="apiSetupPanel" class="card api-setup">
    <div class="api-setup-title">⚙️ API ключ Anthropic</div>
    <input type="password" id="apiKeyInput" placeholder="Введите ваш API ключ...">
    <div class="api-setup-buttons">
      <button class="api-save" id="apiSaveBtn">Сохранить</button>
      <button class="api-cancel" id="apiCancelBtn">Отмена</button>
    </div>
    <div id="apiStatus"></div>
  </div>

  <!-- LIVE TRANSLATION -->
  <div class="card">
    <span class="field-label">Что сказать / перевод</span>
    <textarea id="inputText" placeholder="Пишите на любом языке — русском, немецком, английском, испанском…"></textarea>

    <span class="field-label" style="margin-top:14px;display:block;">Перевести на</span>
    <div class="chips" id="langChips"></div>
    <div class="add-lang-panel" id="addLangPanel" style="display:none;">
      <select id="newLangSelect"></select>
      <button id="confirmAddLangBtn">Добавить</button>
      <button id="cancelAddLangBtn">Отмена</button>
    </div>

    <button class="translate-btn" id="translateBtn">Перевести</button>

    <div class="output-wrap" id="outputWrap">
      <div class="output-text" id="outputText"></div>
      <div class="output-actions">
        <button class="icon-btn" id="speakBtn">🔊 Озвучить</button>
        <button class="icon-btn" id="copyBtn">⧉ Копировать</button>
      </div>
    </div>
  </div>

  <!-- CARDS -->
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="section-title">Готовые карточки</div>
    <div class="tabs" id="tabs"></div>
    <div class="phrase-list" id="phraseList"></div>

    <div class="add-card">
      <input id="newCardText" type="text" placeholder="Добавить фразу на русском…">
      <button id="addCardBtn">+ Карточка</button>
    </div>
    <div class="hint">Карточка переводится на язык, который выбран кнопкой на ней самой — язык можно менять для каждой карточки отдельно.</div>
  </div>

</div>

<script>
const BASE_LANGS = [
  { code:'ru', name:'русский', locale:'ru-RU' },
  { code:'de', name:'немецкий', locale:'de-DE' },
  { code:'en', name:'английский', locale:'en-US' },
  { code:'es', name:'испанский', locale:'es-ES' }
];

const LANGUAGE_CATALOG = [
  { code:'fr', name:'французский', locale:'fr-FR' },
  { code:'it', name:'итальянский', locale:'it-IT' },
  { code:'pt', name:'португальский', locale:'pt-PT' },
  { code:'pl', name:'польский', locale:'pl-PL' },
  { code:'uk', name:'украинский', locale:'uk-UA' },
  { code:'nl', name:'нидерландский', locale:'nl-NL' },
  { code:'tr', name:'турецкий', locale:'tr-TR' },
  { code:'ar', name:'арабский', locale:'ar-SA' },
  { code:'zh', name:'китайский', locale:'zh-CN' },
  { code:'sv', name:'шведский', locale:'sv-SE' },
  { code:'ro', name:'румынский', locale:'ro-RO' },
  { code:'cs', name:'чешский', locale:'cs-CZ' }
];

let activeLangs = [...BASE_LANGS];
let selectedLang = 'de';
let apiKey = null;

function langInfo(code){
  return activeLangs.find(l => l.code === code) || { code, name: code, locale: 'en-US' };
}

function storageGet(key){
  try{
    const value = localStorage.getItem(key);
    return value === null ? null : { value };
  }catch(e){
    return null;
  }
}
function storageSet(key, value){
  try{
    localStorage.setItem(key, value);
    return true;
  }catch(e){
    console.error('storage error', e);
    return false;
  }
}

// API Key management
function loadApiKey(){
  const stored = storageGet('vet-translate-api-key');
  if(stored){
    apiKey = stored.value;
    updateApiStatus();
  }else{
    showApiSetupPanel();
  }
}

function showApiSetupPanel(){
  document.getElementById('apiSetupPanel').style.display = 'flex';
}

function updateApiStatus(){
  const statusEl = document.getElementById('apiStatus');
  const panel = document.getElementById('apiSetupPanel');
  if(apiKey){
    statusEl.className = 'api-status ok';
    statusEl.textContent = '✓ API ключ сохранен';
    panel.style.opacity = '0.7';
  }else{
    statusEl.textContent = '';
  }
}

document.getElementById('apiSaveBtn').onclick = ()=>{
  const input = document.getElementById('apiKeyInput');
  const key = input.value.trim();
  if(key.length < 20){
    const statusEl = document.getElementById('apiStatus');
    statusEl.className = 'api-status error';
    statusEl.textContent = 'API ключ слишком короткий';
    return;
  }
  apiKey = key;
  storageSet('vet-translate-api-key', apiKey);
  input.value = '';
  updateApiStatus();
};

document.getElementById('apiCancelBtn').onclick = ()=>{
  if(apiKey){
    document.getElementById('apiSetupPanel').style.display = 'none';
  }
};

async function loadLanguages(){
  try{
    const res = storageGet('vet-translate-extra-langs');
    const extra = res ? JSON.parse(res.value) : [];
    activeLangs = [...BASE_LANGS, ...extra];
  }catch(e){
    activeLangs = [...BASE_LANGS];
  }
}

async function saveExtraLanguages(){
  const extra = activeLangs.filter(l => !BASE_LANGS.some(b => b.code === l.code));
  storageSet('vet-translate-extra-langs', JSON.stringify(extra));
}

function renderLangChips(){
  const container = document.getElementById('langChips');
  container.innerHTML = '';
  activeLangs.forEach(l=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (l.code === selectedLang ? ' active' : '');
    chip.textContent = l.code.toUpperCase();
    chip.onclick = ()=>{
      selectedLang = l.code;
      renderLangChips();
    };
    container.appendChild(chip);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'chip-add';
  addBtn.textContent = '+ язык';
  addBtn.onclick = openAddLangPanel;
  container.appendChild(addBtn);
}

function openAddLangPanel(){
  const panel = document.getElementById('addLangPanel');
  const select = document.getElementById('newLangSelect');
  const available = LANGUAGE_CATALOG.filter(c => !activeLangs.some(a => a.code === c.code));
  if(available.length === 0){
    select.innerHTML = '<option>Все основные языки уже добавлены</option>';
  }else{
    select.innerHTML = available.map(c => `<option value="${c.code}">${c.name}</option>`).join('');
  }
  panel.style.display = 'flex';
}

document.getElementById('confirmAddLangBtn').onclick = async ()=>{
  const select = document.getElementById('newLangSelect');
  const code = select.value;
  const found = LANGUAGE_CATALOG.find(c => c.code === code);
  if(found && !activeLangs.some(a => a.code === code)){
    activeLangs.push(found);
    await saveExtraLanguages();
    selectedLang = found.code;
    renderLangChips();
    renderPhrases();
  }
  document.getElementById('addLangPanel').style.display = 'none';
};

document.getElementById('cancelAddLangBtn').onclick = ()=>{
  document.getElementById('addLangPanel').style.display = 'none';
};

const FAVORITES_TAB = '__favorites__';

let cards = null;
let activeTab = 'Жалобы';

function migrateCards(loadedCards){
  Object.keys(loadedCards).forEach(cat=>{
    loadedCards[cat] = loadedCards[cat].map(item => ({
      text: item.text,
      favorite: item.favorite === true
    }));
  });
  Object.keys(DEFAULT_CARDS).forEach(cat=>{
    if(!loadedCards[cat]){
      loadedCards[cat] = DEFAULT_CARDS[cat];
    }
  });
  return loadedCards;
}

async function loadCards(){
  let needsSave = false;
  try{
    const res = storageGet('vet-translate-cards');
    if(res){
      const parsed = JSON.parse(res.value);
      const beforeKeys = Object.keys(parsed).length;
      cards = migrateCards(parsed);
      if(Object.keys(cards).length !== beforeKeys) needsSave = true;
    }else{
      cards = DEFAULT_CARDS;
      needsSave = true;
    }
  }catch(e){
    cards = DEFAULT_CARDS;
    needsSave = true;
  }
  renderTabs();
  renderPhrases();
  if(needsSave) await saveCards();
}

async function saveCards(){
  storageSet('vet-translate-cards', JSON.stringify(cards));
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';

  const favTab = document.createElement('div');
  favTab.className = 'tab tab-fav' + (activeTab===FAVORITES_TAB ? ' active':'');
  favTab.textContent = '⭐ Избранное';
  favTab.onclick = ()=>{ activeTab = FAVORITES_TAB; expandedKey = null; renderTabs(); renderPhrases(); };
  tabsEl.appendChild(favTab);

  Object.keys(cards).forEach(cat=>{
    const t = document.createElement('div');
    t.className = 'tab' + (cat===activeTab ? ' active':'');
    t.textContent = cat;
    t.onclick = ()=>{ activeTab = cat; expandedKey = null; renderTabs(); renderPhrases(); };
    tabsEl.appendChild(t);
  });
}

function getEntries(){
  if(activeTab === FAVORITES_TAB){
    const entries = [];
    Object.keys(cards).forEach(cat=>{
      cards[cat].forEach((item, idx)=>{
        if(item.favorite) entries.push({ cat, idx, item });
      });
    });
    return entries;
  }
  return (cards[activeTab] || []).map((item, idx)=>({ cat: activeTab, idx, item }));
}

let expandedKey = null;

function cardTitle(text){
  const firstLine = text.split('\n')[0];
  return firstLine
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
    .replace(/^[\s.:•·]+/, '')
    .replace(/[.:]+$/, '')
    .trim();
}
function cardBody(text){
  const lines = text.split('\n');
  return lines.slice(1).join('\n');
}

function renderPhrases(){
  const list = document.getElementById('phraseList');
  list.innerHTML = '';
  const addCardBox = document.querySelector('.add-card');
  const addCardHint = addCardBox.nextElementSibling;
  if(activeTab === FAVORITES_TAB){
    addCardBox.style.display = 'none';
    if(addCardHint) addCardHint.style.display = 'none';
  }else{
    addCardBox.style.display = 'flex';
    if(addCardHint) addCardHint.style.display = 'block';
  }
  const entries = getEntries();
  if(entries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'hint';
    empty.textContent = activeTab === FAVORITES_TAB
      ? 'Пока нет избранных карточек — отметьте нужные звёздочкой в любой категории.'
      : 'Пока нет карточек в этой категории — добавьте свою фразу ниже.';
    list.appendChild(empty);
    return;
  }
  entries.forEach(({cat, idx, item})=>{
    const key = cat + '-' + idx;
    const isOpen = expandedKey === key;
    const el = document.createElement('div');
    el.className = 'phrase' + (isOpen ? ' open' : '');
    const chipsHtml = activeLangs.map(l => `<div class="mini-chip" data-lang="${l.code}">${l.code.toUpperCase()}</div>`).join('');
    const body = cardBody(item.text);
    el.innerHTML = `
      <div class="phrase-header">
        <span class="phrase-chevron">${isOpen ? '▾' : '▸'}</span>
        <span class="phrase-title">${escapeHtml(cardTitle(item.text))}</span>
      </div>
      <div class="phrase-collapsible" ${isOpen ? '' : 'style="display:none;"'}>
        ${body ? `<div class="phrase-text">${escapeHtml(body)}</div>` : ''}
        <div class="phrase-output" id="pout-${cat}-${idx}"></div>
        <div class="phrase-actions">
          ${chipsHtml}
          <button class="star-btn ${item.favorite ? 'active':''}" title="В избранное">${item.favorite ? '★' : '☆'}</button>
          <button class="edit-btn" title="Редактировать">✎</button>
          <button class="phrase-del">удалить</button>
        </div>
      </div>
    `;
    el.querySelector('.phrase-header').onclick = ()=>{
      expandedKey = isOpen ? null : key;
      renderPhrases();
    };
    if(isOpen){
      const chips = el.querySelectorAll('.mini-chip');
      chips.forEach(chip=>{
        chip.onclick = async (ev)=>{
          ev.stopPropagation();
          chips.forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          const lang = chip.dataset.lang;
          const outEl = el.querySelector('.phrase-output');
          outEl.classList.add('show');
          outEl.innerHTML = '<span class="loading-dot">переводим…</span>';
          try{
            const translated = await translate(item.text, lang);
            renderPhraseOutput(outEl, translated, lang);
          }catch(e){
            outEl.textContent = 'Ошибка перевода, попробуйте ещё раз.';
          }
        };
      });
      el.querySelector('.star-btn').onclick = async (ev)=>{
        ev.stopPropagation();
        cards[cat][idx].favorite = !cards[cat][idx].favorite;
        await saveCards();
        renderPhrases();
      };
      el.querySelector('.edit-btn').onclick = (ev)=>{
        ev.stopPropagation();
        enterEditMode(el, cat, idx, item.text);
      };
      el.querySelector('.phrase-del').onclick = async (ev)=>{
        ev.stopPropagation();
        cards[cat].splice(idx,1);
        if(expandedKey === key) expandedKey = null;
        await saveCards();
        renderPhrases();
      };
    }
    list.appendChild(el);
  });
}

function enterEditMode(el, cat, idx, currentText){
  el.innerHTML = `
    <textarea class="edit-textarea">${currentText}</textarea>
    <div class="edit-actions">
      <button class="edit-save">Сохранить</button>
      <button class="edit-cancel">Отмена</button>
    </div>
  `;
  const textarea = el.querySelector('.edit-textarea');
  textarea.style.minHeight = Math.max(76, currentText.split('\n').length * 22) + 'px';
  el.querySelector('.edit-save').onclick = async ()=>{
    const newText = textarea.value.trim();
    if(newText){
      cards[cat][idx].text = newText;
      await saveCards();
    }
    renderPhrases();
  };
  el.querySelector('.edit-cancel').onclick = ()=>{ renderPhrases(); };
}

function renderPhraseOutput(outEl, translatedText, lang){
  outEl.innerHTML = '';
  const textSpan = document.createElement('span');
  textSpan.className = 'phrase-output-text';
  textSpan.textContent = translatedText;
  const speakBtn = document.createElement('button');
  speakBtn.className = 'phrase-speak-btn';
  speakBtn.textContent = '🔊';
  speakBtn.onclick = () => speak(translatedText, lang);
  outEl.appendChild(textSpan);
  outEl.appendChild(speakBtn);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function translate(text, targetLang){
  if(!apiKey){
    throw new Error('API ключ не установлен');
  }
  const targetName = langInfo(targetLang).name;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({
      model: "claude-3-5-sonnet-20241022",
      max_tokens: 1000,
      system: `You are a translation engine for a veterinary clinic receptionist. Detect the input language automatically. Translate the given text accurately into ${targetName}, preserving veterinary terminology and clarity.`,
      messages: [{ role: "user", content: text }]
    })
  });
  
  if(!response.ok){
    const error = await response.json();
    throw new Error(error.error?.message || 'Translation error');
  }
  
  const data = await response.json();
  const block = (data.content || []).find(b => b.type === 'text');
  return block ? block.text.trim() : '';
}

let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){ cachedVoices = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function pickVoice(localeCode){
  const wantLang = localeCode.split('-')[0];
  if(cachedVoices.length === 0) refreshVoices();
  let voice = cachedVoices.find(v => v.lang.toLowerCase() === localeCode.toLowerCase());
  if(!voice) voice = cachedVoices.find(v => v.lang.toLowerCase().startsWith(wantLang + '-') || v.lang.toLowerCase() === wantLang);
  return voice || null;
}

function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const localeCode = langInfo(lang).locale || 'en-US';
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = localeCode;
    const voice = pickVoice(localeCode);
    if(voice){
      utter.voice = voice;
    } else {
      console.warn('No voice found for', localeCode);
      return;
    }
    window.speechSynthesis.speak(utter);
  }catch(e){ /* speech not available */ }
}

// --- Live translation block ---
const translateBtn = document.getElementById('translateBtn');
const outputWrap = document.getElementById('outputWrap');
const outputText = document.getElementById('outputText');

translateBtn.onclick = async ()=>{
  if(!apiKey){
    showApiSetupPanel();
    return;
  }
  const text = document.getElementById('inputText').value.trim();
  if(!text) return;
  translateBtn.disabled = true;
  translateBtn.textContent = 'Переводим…';
  outputWrap.classList.add('show');
  outputText.innerHTML = '<span class="loading-dot">•••</span>';
  try{
    const result = await translate(text, selectedLang);
    outputText.textContent = result;
  }catch(e){
    outputText.textContent = 'Ошибка: ' + e.message;
  }finally{
    translateBtn.disabled = false;
    translateBtn.textContent = 'Перевести';
  }
};

document.getElementById('speakBtn').onclick = ()=>{
  const text = document.getElementById('outputText').textContent;
  if(text) speak(text, selectedLang);
};

document.getElementById('copyBtn').onclick = ()=>{
  const text = document.getElementById('outputText').textContent;
  if(text) navigator.clipboard.writeText(text);
};

document.getElementById('addCardBtn').onclick = async ()=>{
  const input = document.getElementById('newCardText');
  const text = input.value.trim();
  if(text){
    if(!cards[activeTab]) cards[activeTab] = [];
    cards[activeTab].push({ text, favorite: false });
    await saveCards();
    input.value = '';
    renderPhrases();
  }
};

loadApiKey();
loadLanguages();
loadCards();
renderLangChips();
