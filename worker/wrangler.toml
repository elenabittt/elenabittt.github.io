name = "vettranslate-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
# Flash-Lite: ~0.6s and reliable on the free tier; full Flash was ~4s and often 503 (Sep 2026)
GEMINI_MODEL = "gemini-flash-lite-latest"
# Tried in order when the main model is overloaded (503) or rate limited (429)
GEMINI_FALLBACK_MODELS = "gemini-3.1-flash-lite,gemini-flash-latest"
ALLOWED_ORIGINS = "https://elenabittt.github.io"

# Secrets (GitHub repo secrets, uploaded by .github/workflows/deploy-worker.yml):
#   GEMINI_API_KEY, EDIT_PASSWORD

# Shared phrase cards
[[durable_objects.bindings]]
name = "CARDS"
class_name = "CardStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CardStore"]
